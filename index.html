ь окно"></button><h3 class="popup__title">Обновить аватар</h3><form class="popup__form" name="edit-avatar"><input id="link-input" type="url" name="link" class="popup__input popup__input_type_url" pattern="^(https?:\/\/|ftp:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}([/?#][^\s]*)?$" data-error-message="Ошибка: введите корректный URL (например, https://example.com/image.jpg или http://site.ru/pic.png)" placeholder="Ссылка на картинку" required> <span id="link-input-error"></span> <button type="submit" name="button" class="button popup__button">Сохранить</button></form></div></div><template id="card-template"><li class="places__item card"><img class="card__image" src="" alt=""/> <button type="button" class="card__delete-button" aria-label="Удалить карточку"></button><div class="card__description"><h2 class="card__title"></h2><div class="card__likes"><button type="button" class="card__like-button" aria-label="Поставить лайк"></button><p class="card__likes-count"></p></div></div></li></template></body></html>
